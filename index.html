<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Chati IA</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chati">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14161a">
<style>
  :root { --bg: #14161a; --panel: #1c1f26; --border: #2a2e37; --text: #e6e8ec; --muted: #9aa1ad; --accent: #6b8cff; --ok: #22c55e; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
               font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
         padding: calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); gap: 18px; }
  img.logo { width: 72px; height: 72px; border-radius: 18px; }
  h1 { margin: 0; font-size: 22px; }
  p { margin: 0; color: var(--muted); font-size: 14px; text-align: center; }
  .list { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 10px; }
  .pc { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 14px; background: var(--panel);
        border: 1px solid var(--border); color: var(--text); text-decoration: none; font-size: 16px; }
  .pc .dot { width: 10px; height: 10px; border-radius: 50%; background: #6b7280; flex: none; }
  .pc.on .dot { background: var(--ok); }
  .pc .name { flex: 1; font-weight: 600; }
  .pc .state { font-size: 13px; color: var(--muted); }
  .pc.off { opacity: .55; pointer-events: none; }
  button { padding: 10px 18px; border-radius: 999px; border: 1px solid var(--border); background: var(--panel);
           color: var(--text); font-size: 15px; }
  .ask { width: 100%; max-width: 360px; padding: 16px; border-radius: 14px; background: var(--panel);
         border: 1px solid var(--border); display: flex; flex-direction: column; gap: 12px; text-align: center; }
  .ask .btns { display: flex; gap: 10px; justify-content: center; }
  .ask .yes { background: var(--accent); border-color: var(--accent); color: #fff; }
</style>
</head>
<body>
<main>
  <img class="logo" src="apple-touch-icon.png" alt="">
  <h1>Chati IA</h1>
  <p id="status">Buscando tus ordenadores…</p>
  <div class="list" id="list"></div>
  <button id="retry" style="display:none;">Volver a buscar</button>
  <div class="ask" id="ask" style="display:none;">
    <p>🔔 ¿Quieres que Chati te avise en el móvil cuando termine una tarea o te necesite, aunque esté cerrada?</p>
    <div class="btns"><button class="yes" id="askYes">Activar avisos</button><button id="askNo">Ahora no</button></div>
  </div>
</main>
<script>
// Pantalla de inicio de Chati: pregunta a cada ordenador si esta encendido.
// Si solo hay uno, entra directamente; si hay varios, deja elegir.
// Las direcciones solo funcionan desde los dispositivos de Tailscale de Sergio.
const COMPUTERS = [
  { name: "msi", url: "https://msi.tailcdce77.ts.net/" },
  { name: "hp-omen", url: "https://hp-omen.tailcdce77.ts.net/" },
];

async function isOn(pc) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 4000);
  try {
    const resp = await fetch(pc.url + "health", { signal: ctrl.signal, cache: "no-store" });
    return resp.ok && (await resp.json()).status === "ok";
  } catch (e) {
    return false;
  } finally {
    clearTimeout(timer);
  }
}

// --- Avisos: un service worker por ordenador (alcance avisos/<nombre>/),
// suscrito con la clave de su Chati. La suscripcion se le pasa a Chati en la
// direccion al entrar (#push=...) y ella la guarda en la cuenta.
const PUSH_FLAG = "chati_avisos";  // "on" activados, "no" el usuario no quiso
const canPush = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;

function pushFlag() {
  try { return localStorage.getItem(PUSH_FLAG); } catch (e) { return null; }
}

function b64ToBytes(text) {
  const b64 = (text + "=".repeat((4 - (text.length % 4)) % 4)).replace(/-/g, "+").replace(/_/g, "/");
  return Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
}

function bytesToB64(bytes) {
  let bin = "";
  new Uint8Array(bytes).forEach((b) => { bin += String.fromCharCode(b); });
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

async function activeWorker(reg) {
  if (reg.active) return;
  const w = reg.installing || reg.waiting;
  await new Promise((resolve) => w.addEventListener("statechange", () => { if (w.state === "activated") resolve(); }));
}

async function subscriptionFor(pc) {
  const { key } = await (await fetch(pc.url + "push/key", { cache: "no-store" })).json();
  const reg = await navigator.serviceWorker.register("avisos/sw.js", { scope: "avisos/" + pc.name + "/" });
  await activeWorker(reg);
  let sub = await reg.pushManager.getSubscription();
  const used = sub && sub.options && sub.options.applicationServerKey;
  if (used && bytesToB64(used) !== key) {  // Chati con claves nuevas
    await sub.unsubscribe();
    sub = null;
  }
  return sub || reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(key) });
}

async function pushHash(pc) {
  if (!canPush || pushFlag() !== "on" || Notification.permission !== "granted") return "";
  try {
    const sub = await subscriptionFor(pc);
    return "#push=" + bytesToB64(new TextEncoder().encode(JSON.stringify(sub.toJSON())));
  } catch (e) {
    return "";  // ese Chati aun no tiene avisos (version vieja): se entra igual
  }
}

async function enter(pc) {
  location.replace(pc.url + await pushHash(pc));
}

function askForPush() {
  // solo en el icono instalado (en Safari normal no hay avisos) y una vez
  if (!canPush || pushFlag() || Notification.permission === "denied") return Promise.resolve();
  const ask = document.getElementById("ask");
  ask.style.display = "flex";
  return new Promise((resolve) => {
    document.getElementById("askYes").onclick = async () => {
      const ok = (await Notification.requestPermission()) === "granted";
      try { localStorage.setItem(PUSH_FLAG, ok ? "on" : "no"); } catch (e) { /* nada */ }
      ask.style.display = "none";
      resolve();
    };
    document.getElementById("askNo").onclick = () => {
      try { localStorage.setItem(PUSH_FLAG, "no"); } catch (e) { /* nada */ }
      ask.style.display = "none";
      resolve();
    };
  });
}

async function search() {
  const status = document.getElementById("status");
  const list = document.getElementById("list");
  const retry = document.getElementById("retry");
  status.textContent = "Buscando tus ordenadores…";
  list.innerHTML = "";
  retry.style.display = "none";
  const states = await Promise.all(COMPUTERS.map(isOn));
  const on = COMPUTERS.filter((pc, i) => states[i]);
  if (on.length === 1) {
    status.textContent = `Entrando en ${on[0].name}…`;
    enter(on[0]);
    return;
  }
  status.textContent = on.length ? "¿En qué ordenador quieres entrar?"
    : "No hay ningún ordenador con Chati encendido. ¿Tienes Tailscale activo en el móvil?";
  COMPUTERS.forEach((pc, i) => {
    const a = document.createElement("a");
    a.className = "pc " + (states[i] ? "on" : "off");
    a.href = pc.url;
    a.addEventListener("click", (e) => { e.preventDefault(); enter(pc); });
    a.innerHTML = '<span class="dot"></span><span class="name"></span><span class="state"></span>';
    a.querySelector(".name").textContent = pc.name;
    a.querySelector(".state").textContent = states[i] ? "Encendido" : "Apagado";
    list.appendChild(a);
  });
  retry.style.display = "inline-block";
}

document.getElementById("retry").addEventListener("click", search);
askForPush().then(search);
</script>
</body>
</html>
